<svg width="90" height="42" viewBox="0 0 90 42" xmlns="http://www.w3.org/2000/svg" role="img">
  <style>
    .edge { animation: edge 7s ease-in-out infinite; }
    @keyframes edge { 0%,100% { opacity: .35; } 50% { opacity: .85; } }
    .rise { opacity: 1; animation: rise .5s steps(6,end) backwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); }
                       to   { opacity: 1; transform: translateY(0); } }
    .slide { opacity: 1; animation: slide .45s steps(6,end) backwards; }
    @keyframes slide { from { opacity: 0; transform: translateX(-10px); }
                        to   { opacity: 1; transform: translateX(0); } }
    .type { opacity: 1; animation: type .3s steps(2,end) backwards; }
    @keyframes type { from { opacity: 0; } to { opacity: 1; } }
    .pop { opacity: 1; animation: pop .5s cubic-bezier(.2,.9,.3,1.1) backwards; }
    @keyframes pop { from { opacity: 0; transform: scale(.8); }
                      to   { opacity: 1; transform: scale(1); } }
    text { font-family: 'Courier New', ui-monospace, monospace; }
  </style>
  <defs>
    <filter id="cemail-glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="2.0" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <title>EMAIL</title>
  <desc>Button linking to EMAIL.</desc>
  <rect width="90" height="42" fill="#000000"/>
  <g stroke="#FFFFFF" stroke-width="1.3" fill="none" opacity="0.85">
    <path d="M1 11 V1 H11"/>
    <path d="M79 1 H89 V11"/>
    <path d="M89 31 V41 H79"/>
    <path d="M11 41 H1 V31"/>
  </g>
  <rect x="18" y="18.5" width="5" height="5" fill="#FFFFFF">
    <animate attributeName="opacity" values="1;.2;1" dur="2.6s" repeatCount="indefinite"/>
  </rect>
  <text x="33" y="25.5" font-size="12" font-weight="bold" fill="#FFFFFF"
        letter-spacing="1.4">EMAIL</text>
  <defs>
    <linearGradient id="cemail-sw" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect y="0" width="90" height="42" fill="url(#cemail-sw)" x="-90">
    <animate attributeName="x" values="-90;90;90"
             keyTimes="0;0.220;1" dur="9s" begin="0.0s"
             repeatCount="indefinite"/>
  </rect>
  <rect y="0" width="1.5" height="42" fill="#FFFFFF" opacity="0" x="-90">
    <animate attributeName="x" values="0;90;90" keyTimes="0;0.220;1"
             dur="9s" begin="0.0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;.5;0;0" keyTimes="0;0.110;0.220;1"
             dur="9s" begin="0.0s" repeatCount="indefinite"/>
  </rect>

</svg>
