<svg width="640" height="326" viewBox="0 0 640 326" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #0A0A0A; }
    .border {
      fill: none; stroke: #2A2A2A; stroke-width: 1.5;
      animation: glow 3.5s ease-in-out infinite;
    }
    @keyframes glow {
      0%, 100% { stroke: #2A2A2A; }
      50% { stroke: #5A5A5A; }
    }
    .path { fill: #777777; font-family: 'Courier New', monospace; font-size: 13px; }
    .name { fill: #DDDDDD; font-family: 'Courier New', monospace; font-size: 12.5px; }
    .pct  { fill: #FFFFFF; font-family: 'Courier New', monospace; font-size: 12px; }
    .ver  { fill: #5A5A5A; font-family: 'Courier New', monospace; font-size: 10.5px; }
    .track { fill: #1C1C1C; }
    .fill  { fill: #FFFFFF; }
    .f2 { fill: #C8C8C8; } .f3 { fill: #ABABAB; } .f4 { fill: #8E8E8E; }
    .f5 { fill: #757575; } .f6 { fill: #5E5E5E; } .f7 { fill: #4A4A4A; }
  </style>

  <rect class="bg" width="640" height="326" rx="12"/>
  <rect class="border" x="1.5" y="1.5" width="637" height="323" rx="12"/>

  <text x="28" y="38" class="path">/usr/bin/akshat/stack --by-share</text>
  <line x1="28" y1="52" x2="612" y2="52" stroke="#222222" stroke-width="1"/>

  <g>
    <text x="28" y="96" class="name">Python</text>
    <rect class="track" x="130" y="86" width="360" height="9" rx="4.5"/>
    <rect class="fill"  x="130" y="86" width="360" height="9" rx="4.5">
      <animate attributeName="width" from="0" to="360" dur="1.1s" begin="0.20s" fill="freeze"/>
    </rect>
    <text x="502" y="96" class="pct">27.4%</text>
    <text x="556" y="96" class="ver">3.14</text>
  </g>

  <g>
    <text x="28" y="130" class="name">TypeScript</text>
    <rect class="track" x="130" y="120" width="360" height="9" rx="4.5"/>
    <rect class="f2"    x="130" y="120" width="286" height="9" rx="4.5">
      <animate attributeName="width" from="0" to="286" dur="1.1s" begin="0.35s" fill="freeze"/>
    </rect>
    <text x="502" y="130" class="pct">21.8%</text>
    <text x="556" y="130" class="ver">5.9</text>
  </g>

  <g>
    <text x="28" y="164" class="name">C++</text>
    <rect class="track" x="130" y="154" width="360" height="9" rx="4.5"/>
    <rect class="f3"    x="130" y="154" width="192" height="9" rx="4.5">
      <animate attributeName="width" from="0" to="192" dur="1.1s" begin="0.50s" fill="freeze"/>
    </rect>
    <text x="502" y="164" class="pct">14.6%</text>
    <text x="556" y="164" class="ver">C++23</text>
  </g>

  <g>
    <text x="28" y="198" class="name">Rust</text>
    <rect class="track" x="130" y="188" width="360" height="9" rx="4.5"/>
    <rect class="f4"    x="130" y="188" width="156" height="9" rx="4.5">
      <animate attributeName="width" from="0" to="156" dur="1.1s" begin="0.65s" fill="freeze"/>
    </rect>
    <text x="502" y="198" class="pct">11.9%</text>
    <text x="556" y="198" class="ver">1.90</text>
  </g>

  <g>
    <text x="28" y="232" class="name">JavaScript</text>
    <rect class="track" x="130" y="222" width="360" height="9" rx="4.5"/>
    <rect class="f5"    x="130" y="222" width="135" height="9" rx="4.5">
      <animate attributeName="width" from="0" to="135" dur="1.1s" begin="0.80s" fill="freeze"/>
    </rect>
    <text x="502" y="232" class="pct">10.3%</text>
    <text x="556" y="232" class="ver">ES2025</text>
  </g>

  <g>
    <text x="28" y="266" class="name">ONNX</text>
    <rect class="track" x="130" y="256" width="360" height="9" rx="4.5"/>
    <rect class="f6"    x="130" y="256" width="99" height="9" rx="4.5">
      <animate attributeName="width" from="0" to="99" dur="1.1s" begin="0.95s" fill="freeze"/>
    </rect>
    <text x="502" y="266" class="pct">7.5%</text>
    <text x="556" y="266" class="ver">opset 23</text>
  </g>

  <g>
    <text x="28" y="300" class="name">Ruby</text>
    <rect class="track" x="130" y="290" width="360" height="9" rx="4.5"/>
    <rect class="f7"    x="130" y="290" width="85" height="9" rx="4.5">
      <animate attributeName="width" from="0" to="85" dur="1.1s" begin="1.10s" fill="freeze"/>
    </rect>
    <text x="502" y="300" class="pct">6.5%</text>
    <text x="556" y="300" class="ver">3.4</text>
  </g>
</svg>
