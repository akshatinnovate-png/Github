  <text x="28" y="34" font-size="12.5" fill="#6B6B6B">akshat@jamshedpur:~$</text>
  <text x="186" y="34" font-size="12.5" fill="#FFFFFF">cat ~/akshat/README</text>
  <line x1="28" y1="48" x2="972" y2="48" stroke="#1C1C1C" stroke-width="1"/>
  <rect x="28" y="47" width="58" height="1.5" fill="#FFFFFF" opacity="0.8">
    <animate attributeName="x" values="28;914;28" dur="11s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.1;0.85;0.1" dur="11s" repeatCount="indefinite"/>
  </rect>
  <text class="type" style="animation-delay:0.20s" x="28" y="82" font-size="13" fill="#FFFFFF">In 2024 I started building because I wanted to understand how systems</text>
  <text class="type" style="animation-delay:0.30s" x="28" y="103" font-size="13" fill="#FFFFFF">actually work. That curiosity took me from software into AI, machine</text>
  <text class="type" style="animation-delay:0.40s" x="28" y="124" font-size="13" fill="#FFFFFF">learning, computer vision, robotics, embedded systems, edge computing,</text>
  <text class="type" style="animation-delay:0.50s" x="28" y="145" font-size="13" fill="#FFFFFF">distributed systems and systems engineering.</text>
  <text class="type" style="animation-delay:0.70s" x="28" y="187" font-size="13" fill="#A6A6A6">I work across Python, TypeScript, C++, Rust, JavaScript and ONNX — from</text>
  <text class="type" style="animation-delay:0.80s" x="28" y="208" font-size="13" fill="#A6A6A6">model training and computer vision to APIs, real-time systems, robotic</text>
  <text class="type" style="animation-delay:0.90s" x="28" y="229" font-size="13" fill="#A6A6A6">control and edge inference.</text>
  <text class="type" style="animation-delay:1.10s" x="28" y="271" font-size="13" fill="#A6A6A6">What keeps me interested is the boundary between computation and the</text>
  <text class="type" style="animation-delay:1.20s" x="28" y="292" font-size="13" fill="#A6A6A6">physical world, where algorithms, hardware and real constraints all have</text>
  <text class="type" style="animation-delay:1.30s" x="28" y="313" font-size="13" fill="#A6A6A6">to work together. I go deep into the stack, build from first principles,</text>
  <text class="type" style="animation-delay:1.40s" x="28" y="334" font-size="13" fill="#A6A6A6">and turn ideas into working systems.</text>
  <rect x="28" y="361" width="2" height="64" fill="#FFFFFF" opacity="0.65"/>
  <text class="type" style="animation-delay:1.60s" x="46" y="377" font-size="12.5" fill="#A6A6A6" font-weight="bold">Not a demo. My projects don't set out to show off a technology — they</text>
  <text class="type" style="animation-delay:1.72s" x="46" y="397" font-size="12.5" fill="#A6A6A6">treat resource distribution, operational efficiency, reliability,</text>
  <text class="type" style="animation-delay:1.84s" x="46" y="417" font-size="12.5" fill="#A6A6A6">sustainability and automation as a systems problem.</text>
  <text x="28" y="463" font-size="12.5" fill="#6B6B6B">akshat@jamshedpur:~$</text>
