<svg width="420" height="264" viewBox="0 0 420 264" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #0A0A0A; }
    .border {
      fill: none; stroke: #2A2A2A; stroke-width: 1.5;
      animation: glow 3.5s ease-in-out infinite;
    }
    @keyframes glow {
      0%, 100% { stroke: #2A2A2A; }
      50% { stroke: #5A5A5A; }
    }
    .path { fill: #777777; font-family: 'Courier New', monospace; font-size: 13px; }
    .cap  { fill: #555555; font-family: 'Courier New', monospace; font-size: 10px; letter-spacing: 1px; }
    .edge { fill: none; stroke: #2E2E2E; stroke-width: 1.2; }
    .flow { fill: none; stroke: #FFFFFF; stroke-width: 1.4; stroke-linecap: round; opacity: 0.85; }
    .node { fill: #0A0A0A; stroke: #666666; stroke-width: 1.4; }
    .hub  { fill: #0A0A0A; stroke: #FFFFFF; stroke-width: 1.6; }
    .halo { fill: none; stroke: #FFFFFF; stroke-width: 1; opacity: 0; }
  </style>

  <rect class="bg" width="420" height="264" rx="12"/>
  <rect class="border" x="1.5" y="1.5" width="417" height="261" rx="12"/>

  <text x="24" y="34" class="path">./grid --live</text>
  <line x1="24" y1="48" x2="396" y2="48" stroke="#222222" stroke-width="1"/>

  <g transform="translate(0,16)">
    <!-- static edges -->
    <g class="edge">
      <path d="M210,132 L295,132"/>
      <path d="M210,132 L252,58"/>
      <path d="M210,132 L168,58"/>
      <path d="M210,132 L125,132"/>
      <path d="M210,132 L168,206"/>
      <path d="M210,132 L252,206"/>
      <path d="M295,132 L252,206"/>
      <path d="M252,58 L295,132"/>
      <path d="M168,58 L125,132"/>
      <path d="M125,132 L168,206"/>
    </g>

    <!-- animated energy flow along each spoke -->
    <g>
      <path class="flow" d="M210,132 L295,132" stroke-dasharray="8 77">
        <animate attributeName="stroke-dashoffset" from="85" to="0" dur="1.8s" repeatCount="indefinite"/>
      </path>
      <path class="flow" d="M210,132 L252,58" stroke-dasharray="8 77">
        <animate attributeName="stroke-dashoffset" from="85" to="0" dur="2.3s" begin="0.3s" repeatCount="indefinite"/>
      </path>
      <path class="flow" d="M210,132 L168,58" stroke-dasharray="8 77">
        <animate attributeName="stroke-dashoffset" from="85" to="0" dur="2.0s" begin="0.6s" repeatCount="indefinite"/>
      </path>
      <path class="flow" d="M210,132 L125,132" stroke-dasharray="8 77">
        <animate attributeName="stroke-dashoffset" from="85" to="0" dur="2.6s" begin="0.15s" repeatCount="indefinite"/>
      </path>
      <path class="flow" d="M210,132 L168,206" stroke-dasharray="8 77">
        <animate attributeName="stroke-dashoffset" from="85" to="0" dur="2.1s" begin="0.9s" repeatCount="indefinite"/>
      </path>
      <path class="flow" d="M210,132 L252,206" stroke-dasharray="8 77">
        <animate attributeName="stroke-dashoffset" from="85" to="0" dur="2.4s" begin="0.45s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- peer nodes -->
    <g>
      <circle class="node" cx="295" cy="132" r="7">
        <animate attributeName="stroke" values="#666666;#FFFFFF;#666666" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle class="node" cx="252" cy="58" r="7">
        <animate attributeName="stroke" values="#666666;#FFFFFF;#666666" dur="3s" begin="0.5s" repeatCount="indefinite"/>
      </circle>
      <circle class="node" cx="168" cy="58" r="7">
        <animate attributeName="stroke" values="#666666;#FFFFFF;#666666" dur="3s" begin="1.0s" repeatCount="indefinite"/>
      </circle>
      <circle class="node" cx="125" cy="132" r="7">
        <animate attributeName="stroke" values="#666666;#FFFFFF;#666666" dur="3s" begin="1.5s" repeatCount="indefinite"/>
      </circle>
      <circle class="node" cx="168" cy="206" r="7">
        <animate attributeName="stroke" values="#666666;#FFFFFF;#666666" dur="3s" begin="2.0s" repeatCount="indefinite"/>
      </circle>
      <circle class="node" cx="252" cy="206" r="7">
        <animate attributeName="stroke" values="#666666;#FFFFFF;#666666" dur="3s" begin="2.5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- hub + expanding halo -->
    <circle class="halo" cx="210" cy="132" r="22">
      <animate attributeName="r" from="22" to="60" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle class="hub" cx="210" cy="132" r="22"/>
    <circle cx="210" cy="132" r="4" fill="#FFFFFF">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="210" y="252" text-anchor="middle" class="cap">PEER-TO-PEER ENERGY MESH</text>
</svg>
